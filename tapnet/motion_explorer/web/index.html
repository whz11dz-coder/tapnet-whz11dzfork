/* Theme for the standalone page: every --me-* token the component uses. */
:root {
  --me-bg: #eef0f4;
  --me-surface: #ffffff;
  --me-ink: #141722;
  --me-muted: #586074;
  --me-line: #d6dae3;
  --me-accent: #3243c4;
  --me-accent-ink: #ffffff;
  --me-stage: #0a0c11;
  --me-stage-ink: #e8eaf1;
  --me-stage-muted: #9097aa;
  --me-focus: #3243c4;
  --me-f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --me-f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --me-f-data: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --me-radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --me-bg: #0e1016;
    --me-surface: #161922;
    --me-ink: #e6e8ef;
    --me-muted: #9ba1b3;
    --me-line: #2a2f3b;
    --me-accent: #8f9cff;
    --me-accent-ink: #0e1016;
    --me-stage: #050609;
    --me-stage-ink: #e8eaf1;
    --me-stage-muted: #8a91a4;
    --me-focus: #8f9cff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --me-bg: #0e1016;
  --me-surface: #161922;
  --me-ink: #e6e8ef;
  --me-muted: #9ba1b3;
  --me-line: #2a2f3b;
  --me-accent: #8f9cff;
  --me-accent-ink: #0e1016;
  --me-stage: #050609;
  --me-stage-ink: #e8eaf1;
  --me-stage-muted: #8a91a4;
  --me-focus: #8f9cff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--me-bg);
  color: var(--me-ink);
  font: 15px/1.5 var(--me-f-body);
}
.wrap {
  max-width: 1280px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 20px 32px;
  display: grid;
  gap: 20px;
}
.page-head { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; }
.page-head .titles { min-width: 0; max-width: 68ch; display: grid; gap: 6px; }
h1 {
  margin: 0;
  font: 700 clamp(1.9rem, 4vw, 2.6rem)/1.05 var(--me-f-display);
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.lede { margin: 0; color: var(--me-muted); }
.lang { display: flex; gap: 4px; }
.lang button {
  appearance: none; border: 1px solid var(--me-line); background: var(--me-surface); color: var(--me-ink);
  border-radius: 8px; padding: 4px 9px; font: 500 13px var(--me-f-body); cursor: pointer;
}
.lang button[aria-pressed="true"] { background: var(--me-ink); color: var(--me-bg); border-color: var(--me-ink); }
:focus-visible { outline: 2px solid var(--me-focus); outline-offset: 2px; }
</style>

<body>
<div class="wrap">
  <header class="page-head">
    <div class="titles">
      <h1 data-i18n="title">Tory ruchu</h1>
      <p class="lede" data-i18n="lede"></p>
    </div>
    <div class="lang" role="group" aria-label="Język / Language">
      <button type="button" data-lang="pl">PL</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <div class="motion-explorer" data-root="data/">
    <div class="me-layout">
        <div class="me-main">
          <section class="me-monitor" aria-label="Wideo">
            <div class="me-screen" id="me-screen">
              <canvas id="me-canvas" aria-describedby="me-mode-note"></canvas>
              <div class="me-status" id="me-status"><p data-i18n="loading"></p></div>
            </div>
            <div class="me-transport">
              <button class="me-tbtn" type="button" id="me-play" aria-label="Odtwórz">
                <svg id="me-icon-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>
                <svg id="me-icon-pause" viewBox="0 0 16 16" aria-hidden="true" hidden><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg>
              </button>
              <button class="me-tbtn" type="button" id="me-prev" aria-label="Poprzednia klatka">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.5h2v11H3zM14 2.5v11L6 8z"/></svg>
              </button>
              <button class="me-tbtn" type="button" id="me-next" aria-label="Następna klatka">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11 2.5h2v11h-2zM2 2.5v11L10 8z"/></svg>
              </button>
              <input type="range" id="me-scrub" min="0" max="0" value="0" step="1" aria-label="Klatka">
              <span class="me-clock" id="me-clock"></span>
              <select class="me-speed" id="me-speed" aria-label="Prędkość odtwarzania">
                <option value="0.25">0,25×</option>
                <option value="0.5">0,5×</option>
                <option value="1" selected>1×</option>
              </select>
            </div>
          </section>
          <div class="me-credits">
            <p id="me-credits"></p>
            <p id="me-clip-credit" hidden></p>
          </div>
        </div>
    
        <aside class="me-panel">
          <div class="me-group" id="me-clip-group" hidden>
            <label class="me-label" for="me-clip" data-i18n="clip"></label>
            <select class="me-clip-select" id="me-clip"></select>
          </div>
    
          <div class="me-group">
            <span class="me-label" data-i18n="view"></span>
            <div class="me-seg" role="group">
              <button type="button" id="me-mode-screen" data-mode="screen" data-i18n="modeScreen"></button>
              <button type="button" id="me-mode-space" data-mode="space" data-i18n="modeSpace"></button>
            </div>
            <p class="me-note" id="me-mode-note"></p>
            <div class="me-hue" aria-hidden="true"></div>
            <div class="me-hue-legend"><span data-i18n="hueTop"></span><span data-i18n="hueBottom"></span></div>
          </div>
    
          <div class="me-group">
            <label class="me-label" for="me-tail"><span data-i18n="tail"></span><output id="me-tail-out"></output></label>
            <input type="range" id="me-tail" min="0" max="50" value="16" step="1">
            <label class="me-label" for="me-fg"><span data-i18n="fgThresh"></span><output id="me-fg-out"></output></label>
            <input type="range" id="me-fg" min="0" max="1" value="0.6" step="0.05">
            <p class="me-note" data-i18n="fgNote"></p>
            <label class="me-check"><input type="checkbox" id="me-showbg" checked> <span data-i18n="showBg"></span></label>
          </div>
    
          <div class="me-group">
            <label class="me-label" for="me-brush"><span data-i18n="brush"></span><output id="me-brush-out"></output></label>
            <input type="range" id="me-brush" min="6" max="80" value="22" step="1">
            <p class="me-selinfo" id="me-selinfo"></p>
            <label class="me-check"><input type="checkbox" id="me-additive"> <span data-i18n="additive"></span></label>
            <button class="me-btn" type="button" id="me-clear" data-i18n="clear" disabled></button>
          </div>
    
          <div class="me-group">
            <span class="me-label" data-i18n="data"></span>
            <dl class="me-stats" id="me-stats"></dl>
          </div>
        </aside>
      </div>
  </div>
</div>
<script src="motion-explorer.js?v=3"></script>
</body>
</html>
